<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugen Design System Playground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0E0A1C;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            color: #D0BCFF;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(208, 188, 255, 0.1);
            border-left-color: #D0BCFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="loader">
    <div class="spinner"></div>
    <div style="font-size: 16px; font-weight: 500; letter-spacing: 0.5px;">Loading Mugen Playground...</div>
</div>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
